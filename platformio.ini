; CYD Touch Finder: flash it, and the screen tells you which touch chip the board has, on which pins,
; walks you through calibration, and prints copy-paste config for your own projects.
;   pio run -t upload            flash (default env: ILI9341 panel, works on both of our CYDs)
;   pio test -e native           host tests of include/logic.h (no board needed)
; Colours look wrong (black shows white)? Press the BOOT button: it toggles panel inversion and remembers it.
[platformio]
default_envs = cyd

[common]
; Pinned: Arduino-ESP32 core 3.2.1 (pioarduino), same as qrun-lite.
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
board     = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
extra_scripts = post:scripts/merge_bin.py
; No TOUCH_CS: TFT_eSPI must not own any touch pin, the finder probes them itself.
build_flags =
    -D USER_SETUP_LOADED=1
    -D TFT_WIDTH=320
    -D TFT_HEIGHT=240
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=12
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D TFT_INVERSION_ON=1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
lib_deps =
    bodmer/TFT_eSPI @ 2.5.43

[env:cyd]
extends = common
build_flags = ${common.build_flags} -D ILI9341_2_DRIVER=1

; Fallback for CYD2USB-style boards whose ST7789 panel stays blank/garbled with the ILI9341 driver (untested here).
[env:cyd-st7789]
extends = common
build_flags = ${common.build_flags} -D ST7789_DRIVER=1

[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
build_flags = -std=gnu++17 -Wall -Wextra -Werror
